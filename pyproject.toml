[project]
name = "visual-window-control"
version = "0.1.0"
description = "MCP server & CLI for controlling windows visually — capture screenshots, OCR text extraction, and keyboard/mouse input"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "sunasaji" },
]
readme = "README.md"
keywords = ["mcp", "ocr", "window-control", "automation", "rdp", "tesseract", "remote-desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "pynput>=1.7.6",
    "mss>=9.0.0",
    "pywin32>=306",
]

[project.urls]
Homepage = "https://github.com/sunasaji/visual-window-control"
Repository = "https://github.com/sunasaji/visual-window-control"
Issues = "https://github.com/sunasaji/visual-window-control/issues"

[project.scripts]
mcp-visual-window-control = "visual_window_control.server:main"
vwctl = "visual_window_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
