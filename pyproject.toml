[project]
name = "visual-window-control"
version = "0.1.0"
description = "MCP server & CLI for visual window control via OCR"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "pynput>=1.7.6",
    "mss>=9.0.0",
    "pywin32>=306",
]

[project.scripts]
mcp-visual-window-control = "visual_window_control.server:main"
vwctl = "visual_window_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
